[package]
name = "spatial-id"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Spatial ID (Ouranos 4D spatio-temporal ID) types, collections, geometry conversions, and queries"


[workspace]
members = [
    ".",
    "spatial-id-derive",
    "xtask"
]

[dependencies]
# デフォルトで必要なもの
hashbrown = "0.17.1"
spatial-id-derive = { version = "0.1.4", path = "spatial-id-derive" }
libm = "0.2.16"
triomphe = { version = "0.1.17", default-features = false }

# featuresで切り替え可能なもの
rand = { version = "0.10.2", optional = true }
rayon = { version = "1.10", optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }


[features]
default = ["std", "rayon", "json","temporal_id"]
std = []
rayon = ["dep:rayon", "std"]
random = [ "rand" ]
temporal_id = []
rand = ["dep:rand"]
json = ["dep:serde", "dep:serde_json"]



[dev-dependencies]
rand = "0.10.1"
proptest = "1.11.0"
rand_chacha = "0.10.0"
insta = "1"
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.dev]
debug = 0 
codegen-units = 256
split-debuginfo = "unpacked"

[profile.test]
debug = 0 
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[lib]
bench = false

# デモ用バイナリ。JSON 読み書きとファイル I/O を使うため std と json が要る。
[[bin]]
name = "spatial-id"
path = "src/main.rs"
required-features = ["std", "json"]

[[bench]]
name = "query_unary_shift"
path = "benches/query/unary/shift.rs"
harness = false
required-features = ["json"]

[[bench]]
name = "query_unary_falloff"
path = "benches/query/unary/falloff.rs"
harness = false
required-features = ["json"]

[[bench]]
name = "query_unary_extrude"
path = "benches/query/unary/extrude.rs"
harness = false
required-features = ["json"]

[[bench]]
name = "query_unary_filter_values"
path = "benches/query/unary/filter_values.rs"
harness = false
required-features = ["json"]

[[bench]]
name = "query_unary_zoom_out"
path = "benches/query/unary/zoom_out.rs"
harness = false
required-features = ["json", "rayon"]

[[bench]]
name = "query_workflow_risk_diffusion"
path = "benches/query/workflow/risk_diffusion.rs"
harness = false
required-features = ["json", "rayon"]

[[example]]
name = "map_json"
required-features = ["json"]
