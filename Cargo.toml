[package]
name = "kasane-logic"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "This is Kasane-logic"


[workspace]
members = [
    ".",
    "xtask"
]

[dependencies]
# デフォルトで必要なもの
hashbrown = "0.17.1"
libm = "0.2.16"

# featuresで切り替え可能なもの
rand = { version = "0.10.2", optional = true }
rayon = { version = "1.10", optional = true }
rkyv = { version = "0.8.17", features = ["unaligned"], optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[features]
default = ["std", "rayon", "json","temporal_id"]
std = []
rayon = ["dep:rayon", "std"]
random = [ "rand" ]
temporal_id = []
rand = ["dep:rand"]
persist = ["dep:rkyv", "std"]
json = ["dep:serde", "dep:serde_json"]

# 実験的機能。予告なく変更・削除されうる。
unstable = ["dep:tracing", "std"]

[dev-dependencies]
rand = "0.10.1"
proptest = "1.11.0"
rand_chacha = "0.10.0"
insta = "1"
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.dev]
debug = 0 
codegen-units = 256
split-debuginfo = "unpacked"

[profile.test]
debug = 0 
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[lib]
bench = false

# デモ用バイナリ。JSON 読み書きとファイル I/O を使うため std と json が要る。
[[bin]]
name = "kasane-logic"
path = "src/main.rs"
required-features = ["std", "json"]


