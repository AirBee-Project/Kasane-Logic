name: main merge tests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    if: github.event.pull_request.draft == false
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup mold
        uses: rui314/setup-mold@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  verify:
    if: github.event.pull_request.draft == false
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup mold
        if: matrix.os == 'ubuntu-24.04'
        uses: rui314/setup-mold@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "verify-${{ matrix.os }}"

      - name: Test (std; various features)
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon" "std,random,temporal_id" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            cargo test --locked --lib --bins --tests --no-default-features --features "$feature"
          done

      - name: Test ignored
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            cargo test --locked --lib --bins --tests --no-default-features --features "$feature" -- --ignored
          done

      - name: Doctest
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            cargo test --locked --doc --no-default-features --features "$feature"
          done

      - name: Clippy (std)
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon" "std,random,temporal_id" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            cargo clippy --locked --lib --bins --tests --no-default-features --features "$feature" -- -D warnings
          done

      - name: Build & Clippy (no_std)
        shell: bash
        run: |
          set -euo pipefail
          features=("" "temporal_id")
          for feature in "${features[@]}"; do
            if [ -n "$feature" ]; then
              cargo build --locked --lib --no-default-features --features "$feature"
              cargo clippy --locked --lib --no-default-features --features "$feature" -- -D warnings
            else
              cargo build --locked --lib --no-default-features
              cargo clippy --locked --lib --no-default-features -- -D warnings
            fi
          done

      - name: Rustdoc (std)
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon" "std,random,temporal_id" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features --features "$feature"
          done

      - name: Rustdoc (no_std)
        shell: bash
        run: |
          set -euo pipefail
          features=("" "temporal_id")
          for feature in "${features[@]}"; do
            if [ -n "$feature" ]; then
              RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features --features "$feature"
            else
              RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features
            fi
          done

  semver_check:
    if: github.event.pull_request.draft == false
    name: cargo semver-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Check semver compliance
        id: semver
        shell: bash
        run: |
          set +e
          cargo semver-checks check-release --package kasane-logic > semver_output.txt 2>&1
          EXIT_CODE=$?
          set -e
          cat semver_output.txt
          if [ $EXIT_CODE -eq 0 ]; then
            echo "SEMVER_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "SEMVER_STATUS=warning" >> "$GITHUB_ENV"
          fi

      - name: Post or update PR comment
        if: always() && steps.semver.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- cargo-semver-checks-comment -->';
            const status = process.env.SEMVER_STATUS;

            if (!status) {
              return;
            }

            let log = '';
            if (fs.existsSync('semver_output.txt')) {
              log = fs.readFileSync('semver_output.txt', 'utf8').trim();
            }

            let body = `${marker}\n### Cargo SemVer Checks レポート\n\n`;
            if (status === 'success') {
              body += '✅ **SemVer チェック通過**: stable API において破壊的変更は検知されませんでした。\n';
            } else {
              body += '⚠️ **SemVer 破壊的変更の検知（警告）**:\nstable API において互換性の変更が検知されました。メジャーバージョン更新を予定している場合は問題ありませんが、マイナー／パッチ更新の場合はご確認ください。\n';
            }

            if (log) {
              const maxLen = 60000;
              const trimmedLog = log.length > maxLen ? log.slice(0, maxLen) + '\n... (truncated)' : log;
              body += `\n<details><summary>詳細ログ</summary>\n\n\`\`\`text\n${trimmedLog}\n\`\`\`\n</details>\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            const botComment = comments.find(comment => comment.body.includes(marker));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: body,
              });
            }
