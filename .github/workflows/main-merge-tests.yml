name: main merge tests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  # PR から復元できるキャッシュは自 PR と main で保存したものだけなので、main でも実行して保存しておく
  push:
    branches:
      - main

jobs:
  fmt:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup mold
        uses: rui314/setup-mold@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  verify:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: verify
    runs-on: ubuntu-24.04
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Setup mold
        uses: rui314/setup-mold@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "verify-ubuntu-24.04"

      - name: Test (std; various features)
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon" "std,random,temporal_id" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            cargo nextest run --locked --lib --bins --tests --no-default-features --features "$feature"
          done

      - name: Test ignored
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            cargo nextest run --locked --lib --bins --tests --no-default-features --features "$feature" --run-ignored ignored-only
          done

      - name: Doctest
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            cargo test --locked --doc --no-default-features --features "$feature"
          done

      - name: Clippy (std)
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon" "std,random,temporal_id" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            cargo clippy --locked --lib --bins --tests --no-default-features --features "$feature" -- -D warnings
          done

      - name: Build & Clippy (no_std)
        shell: bash
        run: |
          set -euo pipefail
          features=("" "temporal_id")
          for feature in "${features[@]}"; do
            if [ -n "$feature" ]; then
              cargo build --locked --lib --no-default-features --features "$feature"
              cargo clippy --locked --lib --no-default-features --features "$feature" -- -D warnings
            else
              cargo build --locked --lib --no-default-features
              cargo clippy --locked --lib --no-default-features -- -D warnings
            fi
          done

      - name: Rustdoc (std)
        shell: bash
        run: |
          set -euo pipefail
          features=("std" "std,rayon" "std,random,temporal_id" "std,rayon,random,temporal_id")
          for feature in "${features[@]}"; do
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features --features "$feature"
          done

      - name: Rustdoc (no_std)
        shell: bash
        run: |
          set -euo pipefail
          features=("" "temporal_id")
          for feature in "${features[@]}"; do
            if [ -n "$feature" ]; then
              RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features --features "$feature"
            else
              RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features
            fi
          done
