name: semver check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  semver_check:
    name: cargo semver-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve release type
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          RELEASE_TYPE=$(jq -r '[.[] | select(test("^release:(patch|minor|major|none)$"))] | if length == 1 then .[0] | ltrimstr("release:") else empty end' <<< "$LABELS")
          if [ -z "$RELEASE_TYPE" ]; then
            echo "::error::release:patch / release:minor / release:major / release:none のいずれか 1 つをラベルに付けてください"
            exit 1
          fi
          echo "RELEASE_TYPE=$RELEASE_TYPE" >> "$GITHUB_ENV"

      - name: Checkout
        if: env.RELEASE_TYPE != 'none'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        if: env.RELEASE_TYPE != 'none'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        if: env.RELEASE_TYPE != 'none'
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Cache Rust
        if: env.RELEASE_TYPE != 'none'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "semver-ubuntu-24.04"

      # feature を指定しないと、cargo-semver-checks は unstable などの名前の feature を除外して検証する
      - name: Check semver compliance
        if: env.RELEASE_TYPE != 'none'
        run: cargo semver-checks check-release --package kasane-logic --baseline-rev "origin/${{ github.base_ref }}" --release-type "$RELEASE_TYPE"
