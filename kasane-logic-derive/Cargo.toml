[package]
name = "kasane-logic-derive"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Derive macros for kasane-logic"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
